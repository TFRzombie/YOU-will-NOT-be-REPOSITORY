  <head><script type='text/javascript' >
const lsijVersion = 1;



class Flags {
	constructor(url, terms) {
		this.url = url;
		this.matched = {};

		this.terms = [];
		terms.forEach((term) => {
			let s = term.replace(/[\]{}?^$().*\\+|[]/g, '\\$&');
			s = s.replace(/\\\*/g, '.*');
			s = s.replace(/\\\?/g, '.');
			let regex = new RegExp('\\b' + s + '\\b', 'gi');

			this.terms.push({term: term, regex: regex});
		});
	}

	report(flags) {
		if (!flags.length) {
			return;
		}
		console.debug('[LS Filter] sending -> ', flags);

		const xhr = new XMLHttpRequest();
		xhr.open('POST', document.location.origin + '/f716898c966c3d9affd94792c5b0670c278f0bcc64a8c058ab015f0d39324a9d/log_flag', true);
		xhr.send(JSON.stringify({
			url: this.url.href,
			flags: flags,
			at_epoch_ms: Date.now()
		}));
	}

	matchTerms(input) {
		const matches = [];
		this.terms.forEach((term) => {
			if (this.matched[term.term]) {
				return;
			}

			const hits = input.match(term.regex);
			if (!hits || !hits.length) {
				return;
			}

			this.matched[term.term] = hits.length;
			matches.push([term.term, hits.length]);
		});

		return matches;
	}

	scanIntentValue(value) {
		const matches = this.matchTerms(value);
		const changes = [];

		matches.forEach((match) => {
			match[2] = true; // mark as user entered
			changes.push(match);
		});

		if (changes.length) {
			this.report(changes);
		}
	}

	scanIntentValues(values) {
		values.forEach((value) => {
			this.scanIntentValue(value);
		});
	}

	scanIntentEvent(event) {
		switch (event.target.tagName.toLowerCase()) {
		case 'input':
			let type = event.target.type || 'text';
			type = type.toLowerCase();

			// Dont scan password fields
			if (type === 'password') {
				return;
			}

			this.scanIntentValue(event.target.value);
			break;

		case 'textarea':
			this.scanIntentValue(event.target.value);
			break;

		}
	}

	scanIntent() {
		if (typeof(gatherIntent) === 'function') {
			const intent = gatherIntent();
			if (intent.length) {
				this.scanIntentValues(intent);
			}
		}
	}

	onChange(event) {
		this.scanIntentEvent(event);
	}

	onKeyup(event) {
		this.scanIntentEvent(event);
	}

	bindDOM() {
		document.addEventListener('change', this.onChange.bind(this));
		document.addEventListener('keyup', this.onKeyup.bind(this));
		setInterval(() => {
			this.scanIntent();
		}, 1000);
	}
}

function initFlagScanning() {
	const xhr = new XMLHttpRequest();
	xhr.open('POST', document.location.origin + '/f716898c966c3d9affd94792c5b0670c278f0bcc64a8c058ab015f0d39324a9d/get_flags', false);
	xhr.send(JSON.stringify({}));
	
	let terms = [];
	if (xhr.status === 200) {
		try {
			terms = JSON.parse(xhr.responseText);
		} catch (e) {
			console.error('[LS Filter] failed to parse flagged terms:', e);
		}
	}

	if (!terms.length) {
		return;
	}

	console.debug('[LS Filter] init flag scanning');
	const a = document.createElement('A');
	a.href = window.location.href;
	const flags = new Flags(a, terms);

	
	console.debug('[LS Filter] flagging intent');

	if (typeof(initGatherIntent) === 'function') {
		initGatherIntent();
	}
	flags.bindDOM();
	
};

initFlagScanning();



const blockImg = "/f716898c966c3d9affd94792c5b0670c278f0bcc64a8c058ab015f0d39324a9d/blocked-image-search.png";

let hardBlockPolicy;

function scoreUrl(body, callback) {
  const xhr = new XMLHttpRequest();
  const checkUrl = document.location.origin + '/f716898c966c3d9affd94792c5b0670c278f0bcc64a8c058ab015f0d39324a9d/log';
  xhr.open('POST', checkUrl, true);
  xhr.send(JSON.stringify(body));
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) { // Request completed
      if (this.status === 200 && xhr.responseText) {
        try {
          const score = JSON.parse(xhr.responseText);
          if (callback) {
            callback(score);
          } else {
            console.log('[LS Filter] score ->', score.allow);
            if (score.redirect) {
              window.location.href = score.redirect;
              hardBlock();
            } else if (score.reason === 'teacher_override' && score.classroomActive) {
              startClassroomActivePoll(window.location.href);
            }
          }
        } catch (err) {
          console.error('[LS Filter] error parsing score response ->', err);
          if (callback) {
            callback({ allow: 'error', error: err.message });
          }
        }
      } else {
        // HTTP error or empty response
        console.error('[LS Filter] score request failed ->', this.status, xhr.statusText);
        if (callback) {
          callback({ allow: 'error', error: `HTTP ${this.status}` });
        }
      }
    }
  };
  
  // Handle network errors
  xhr.onerror = function() {
    console.error('[LS Filter] score request network error');
    if (callback) {
      callback({ allow: 'error', error: 'network error' });
    }
  };
  
  // Handle timeout
  xhr.ontimeout = function() {
    console.error('[LS Filter] score request timeout');
    if (callback) {
      callback({ allow: 'error', error: 'timeout' });
    }
  };
}

function getHardBlockPolicy() {
  if (typeof(trustedTypes) !== 'undefined' && !hardBlockPolicy) {
    hardBlockPolicy = trustedTypes.createPolicy('hardBlock', {
      createHTML: (string) => string
    });
  }
  return hardBlockPolicy;
}

function hardBlock() {
  pauseVideo();
  const stopInt = setInterval(pauseVideo, 500);
  setTimeout(() => {
    const policy = getHardBlockPolicy();
    if (policy) {
      document.body.innerHTML = policy.createHTML(`<img src="${blockImg}" style="width: 100%; height: 100%">`);
    } else {
      document.body.innerHTML = `<img src="${blockImg}" style="width: 100%; height: 100%">`;
    }
    clearInterval(stopInt);
  }, 3000)
}

function pauseVideo() {
  const ea = document.getElementsByTagName('video');
  if (ea.length == 0) { return; }
  for (i in ea) {
    if (typeof(ea[i].pause) !== 'function') { continue; }
    console.debug('[LS Filter] paused ->', ea[i].paused);
    if (!ea[i].paused) {
      console.debug('[LS Filter] pause video');
      ea[i].pause();
    }
    const e = ea[i].closest('ytd-channel-video-player-renderer');
    if (e && e.style.display !== 'none') {
      console.debug('[LS Filter] hide autoplay container');
      e.style.display = 'none';
    }
  }
}

function startClassroomActivePoll(pageUrl) {
  console.log('[LS Filter] classroom active — polling for allow removal');
  const host = new URL(pageUrl).hostname;
  const checkUrl = document.location.origin + '/f716898c966c3d9affd94792c5b0670c278f0bcc64a8c058ab015f0d39324a9d/classroomActiveCheck';
  const interval = setInterval(function() {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', checkUrl, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4 && xhr.status === 200) {
        try {
          const resp = JSON.parse(xhr.responseText);
          if (!resp.active) {
            console.log('[LS Filter] classroom allow removed — rescoring');
            clearInterval(interval);
            window.location.href = pageUrl;
          }
        } catch (e) {
          console.error('[LS Filter] error parsing classroom active check ->', e);
        }
      }
    };
    xhr.send(JSON.stringify({ host: host }));
  }, 5000);
}

function onLoad() {
  console.log('[LS Filter] loaded');
  if (window.top === window.self) {
    console.log('[LS Filter] top window: ' + window.location.href);
    scoreUrl({ url: window.location.href }, false);
  }
}

onLoad();
